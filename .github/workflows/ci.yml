name: ci

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash 语法检查
        run: |
          set -e
          for f in *.sh scripts/*.sh; do
            bash -n "$f" && echo "OK  $f"
          done

      - name: python 语法检查
        run: python3 -m py_compile *.py scripts/*.py

      - name: shellcheck（仅报 error 级别）
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S error *.sh scripts/*.sh
